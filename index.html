<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微企付 · 智能客服知识库</title>
<style>
  :root{
    --brand:#2b6cff; --brand-dark:#1e4fd6; --brand-soft:#eaf1ff;
    --bg:#f5f7fb; --card:#ffffff; --text:#1f2733; --muted:#6b7688;
    --line:#e6eaf2; --hi:#fff3bf; --ok:#16a34a;
    --shadow:0 2px 12px rgba(30,60,120,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:var(--brand);text-decoration:none}

  header{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;padding:26px 20px 30px}
  .hwrap{max-width:1180px;margin:0 auto}
  header h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
  header .logo{width:30px;height:30px;background:#fff;border-radius:8px;display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:16px}
  header p{opacity:.9;font-size:13px;margin-top:6px}

  .searchbar{max-width:1180px;margin:-18px auto 0;padding:0 20px;position:relative;z-index:5}
  .searchbox{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
  .searchbox input{flex:1;border:none;outline:none;font-size:16px;padding:8px 6px;background:transparent;color:var(--text)}
  .searchbox .btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:15px;cursor:pointer;white-space:nowrap}
  .searchbox .btn:hover{background:var(--brand-dark)}
  .tabs{max-width:1180px;margin:14px auto 0;padding:0 20px;display:flex;gap:8px}
  .tab{padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--muted)}
  .tab.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark);font-weight:600}
  .hint{max-width:1180px;margin:10px auto 0;padding:0 20px;font-size:12px;color:var(--muted)}
  .hint b{color:var(--brand-dark)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--brand);color:var(--brand)}

  .main{max-width:1180px;margin:18px auto 60px;padding:0 20px;display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}

  .side{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;position:sticky;top:14px;max-height:calc(100vh - 30px);overflow:auto}
  .side h3{font-size:13px;color:var(--muted);margin-bottom:10px;letter-spacing:.5px}
  .tree .l1{margin-bottom:4px}
  .tree .l1>.node{font-weight:700;color:var(--text)}
  .node{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:14px}
  .node:hover{background:var(--brand-soft)}
  .node.active{background:var(--brand);color:#fff}
  .node .cnt{font-size:11px;opacity:.7;background:rgba(0,0,0,.06);border-radius:10px;padding:0 7px;margin-left:6px}
  .node.active .cnt{background:rgba(255,255,255,.25)}
  .tree .l2wrap{margin-left:8px;border-left:2px solid var(--line);padding-left:6px;display:none}
  .tree .l1.open .l2wrap{display:block}
  .tree .l2>.node{font-weight:500}
  .arrow{transition:.2s;font-size:10px;color:var(--muted)}
  .l1.open .arrow{transform:rotate(90deg)}

  .content{min-height:300px}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:12px}
  .crumb b{color:var(--text)}
  .stat{font-size:13px;color:var(--muted);margin-bottom:12px}
  .stat b{color:var(--brand-dark)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .qhead{padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .qhead:hover{background:#fafbfe}
  .qico{flex:none;width:22px;height:22px;border-radius:6px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
  .qtext{flex:1;font-size:15px;font-weight:600;color:var(--text)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .tag{font-size:11px;color:var(--muted);background:#f0f2f7;border-radius:6px;padding:1px 8px}
  .tag.err{background:#fff0f0;color:#d14343}
  .toggle{flex:none;color:var(--muted);font-size:13px;margin-top:2px;transition:.2s}
  .card.open .toggle{transform:rotate(180deg)}
  .ans{max-height:0;overflow:hidden;transition:max-height .25s ease;background:#fafbfe;border-top:1px solid transparent}
  .card.open .ans{max-height:1200px;border-top-color:var(--line)}
  .ans-inner{padding:14px 16px;font-size:14px;color:#374151;white-space:pre-wrap;line-height:1.75}
  .ans-inner .lbl{display:inline-block;font-size:11px;color:var(--ok);background:#e9f9ee;border-radius:5px;padding:1px 8px;margin-bottom:8px;font-weight:600}
  .errbox{background:#fff8f8;border:1px solid #ffe0e0;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#8a4b4b;white-space:pre-wrap}
  .errbox .lbl{color:#d14343;background:#ffeaea}

  .shot{margin-bottom:12px}
  .shot img{max-width:100%;max-height:420px;border:1px solid var(--line);border-radius:8px;margin-top:4px;cursor:zoom-in;display:block;background:#fff}
  .shot-tip{font-size:11px;color:var(--muted);margin-top:5px}
  .lightbox{position:fixed;inset:0;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;z-index:99;padding:30px;cursor:zoom-out}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  mark{background:var(--hi);padding:0 2px;border-radius:3px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-size:40px;margin-bottom:10px}

  @media(max-width:820px){
    .main{grid-template-columns:1fr}
    .side{position:relative;max-height:none;top:0}
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1><span class="logo">微</span>微企付 · 智能客服知识库</h1>
    <p>输入关键词或问题智能匹配答案，也可通过左侧目录逐级查找</p>
  </div>
</header>

<div class="searchbar">
  <div class="searchbox">
    <input id="q" type="text" placeholder="输入问题或关键词，如：费率、限额、怎么退款、身份认证失败…" autocomplete="off">
    <button class="btn" id="searchBtn">搜索</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-mode="text">📋 常见问题</div>
  <div class="tab" data-mode="image">🖼️ 报错识别</div>
</div>
<div class="hint" id="hint"></div>

<div class="main">
  <aside class="side">
    <h3 id="sideTitle">问题目录</h3>
    <div class="tree" id="tree"></div>
  </aside>
  <section class="content">
    <div class="crumb" id="crumb"></div>
    <div class="stat" id="stat"></div>
    <div id="list"></div>
  </section>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lightbox-img" src="" alt="报错截图"></div>

<script>
const DATA = {"text": [{"id": "t0", "l1": "售前咨询类", "l2": "产品功能咨询", "l3": "产品介绍", "q": "介绍一下微企付", "a": "您好，微企付是腾讯和银行合作的针对企业经营采购场景设计的付款工具。主要聚合银行转账的能力，来实现便捷、大额、安全的企业付款流程。\n在微企付中支持个人银行卡付款和企业对公付款两种，其中个人付款最高可支持单笔100万支付限额，到账快，安全便捷。"}, {"id": "t1", "l1": "售前咨询类", "l2": "产品功能咨询", "l3": "产品介绍", "q": "微企付是什么？", "a": "您好，微企付是腾讯和银行合作的针对企业经营采购场景设计的付款工具。主要聚合银行转账的能力，来实现便捷、大额、安全的企业付款流程。\n在微企付中支持个人银行卡付款和企业对公付款两种，其中个人付款最高可支持单笔100万支付限额，到账快，安全便捷。"}, {"id": "t2", "l1": "售前咨询类", "l2": "产品功能咨询", "l3": "产品优势", "q": "微企付有什么优势吗？", "a": "您好，微企付作为腾讯推出的针对采购场景下的支付工具，主要有以下几个优势：\n1、更加大额：付款额度远高于快捷支付产品，单笔最高可支付100万。\n2、更加快捷：对比线下转账，微企付可以自动将订单和付款关联，提升付款效率。\n3、更加优惠：使用微企付可以获得不定期的支付现金红包，优惠活动多。"}, {"id": "t3", "l1": "售前咨询类", "l2": "产品功能咨询", "l3": "支付能力", "q": "支持哪些支付通道？", "a": "您好，我们支持个人付款和对公付款。个人付款中支持全部银行的个人储蓄卡付款，建行、中行、招行、交行、浦发、兴业6家银行的信用卡付款。对公付款中支持全部银行的对公转账付款。"}, {"id": "t4", "l1": "售前咨询类", "l2": "产品功能咨询", "l3": "支付能力", "q": "可以使用什么来付款？", "a": "您好，我们支持个人付款和对公付款。个人付款中支持全部银行的个人储蓄卡付款，建行、中行、招行、交行、浦发、兴业6家银行的信用卡付款。对公付款中支持全部银行的对公转账付款。"}, {"id": "t8", "l1": "接入实施类", "l2": "技术对接问题", "l3": "接入场景", "q": "微企付可以接入哪些支付模式？", "a": "微企付针对采购环节的各类常见场景，提供APP支付、小程序支付、扫码支付、H5支付等支付模式。"}, {"id": "t9", "l1": "接入实施类", "l2": "技术对接问题", "l3": "接入场景", "q": "我的小程序/APP/购物网页可以接入微企付吗？", "a": "微企付针对采购环节的各类常见场景，提供APP支付、小程序支付、扫码支付、H5支付等支付模式。"}, {"id": "t10", "l1": "接入实施类", "l2": "技术对接问题", "l3": "开发指引", "q": "微企付开发文档", "a": "您好，微企付接入指引可以参考：https://businesspay.qq.com/p/doc/mse/flow/"}, {"id": "t11", "l1": "接入实施类", "l2": "资料提交问题", "l3": "商户入驻", "q": "新增商户提示不在白名单", "a": "您好，商户入驻前需要先由微企付侧进行加白，请先联系对接您的微企付运营为您即将入驻的商户进行加白操作。"}, {"id": "t13", "l1": "接入实施类", "l2": "审核问题", "l3": "审核问题", "q": "商户入驻审核需要多久？", "a": "您好，商户入驻审核一般5-7个工作日。"}, {"id": "t14", "l1": "商户端使用问题", "l2": "账单问题", "l3": "账单查询", "q": "怎么查询微企付商户账单？", "a": "您好，可以访问：https://businesspay.qq.com/p/merchant/mgnt/account\n在【经营中心】-【交易账单】中查询，也可以提供明细下载。"}, {"id": "t15", "l1": "商户端使用问题", "l2": "账单问题", "l3": "账单核对", "q": "微企付账单和商户自己系统内的账单对不上怎么办？", "a": "您好，请提供您的商户号，并转人工进行核对。"}, {"id": "t16", "l1": "商户端使用问题", "l2": "分账问题", "l3": "添加分账", "q": "如何添加分账接收方？", "a": "您好，在微企付商户中心-分账接收方添加中进行操作。地址：https://businesspay.qq.com/p/merchant/mgnt/allocation"}, {"id": "t17", "l1": "商户端使用问题", "l2": "分账问题", "l3": "添加分账", "q": "分账接收方可以为个人吗？", "a": "可以，分账接收方可以添加企业、个体工商户、个人经营者。"}, {"id": "t18", "l1": "商户端使用问题", "l2": "分账问题", "l3": "查询分账", "q": "如何查询分账记录？", "a": "您好，在商户中心的【分账记录】和【分账账单】中可以进行查询。"}, {"id": "t19", "l1": "商户端使用问题", "l2": "退款问题", "l3": "退款查询", "q": "如何查询商户号下的退款记录？", "a": "您好，在商户中心的【退款查询】中进行查询和下载明细。"}, {"id": "t20", "l1": "商户端使用问题", "l2": "权限问题", "l3": "权限问题", "q": "如何在微企付管理后台添加员工账号？", "a": "您好，可以在商家后台选择「员工账号管理」，点击「添加账号」，超管完成确认后即添加成功。\n详见指引：https://businesspay.qq.com/p/helper/detail?groupId=41a5a992-4653-6fed-4360-84df50ab534f&faqId=0fe87a8f-850d-26df-cc9c-f9e9df80584d"}, {"id": "t21", "l1": "商户端使用问题", "l2": "提现问题", "l3": "如何提现", "q": "如何更换微企付提现账户？", "a": "1、进入「账户中心-银行账户信息」，点击右上角的「修改账户」。\n2、填写新的银行账户信息后，点击「下一步」。\n3、超级管理员扫码确认账户信息，超管确认后，微企付会向新绑定的银行账户打入一笔随机金额，请查询账户流水，将打款验证的金额填写到页面上，用于确认新绑定的账户可以正常收款。\n4、点击「下一步」提交银行审核，审核通过后即完成账号变更。\n详见指引：https://businesspay.qq.com/p/helper/detail?groupId=41a5a992-4653-6fed-4360-84df50ab534f&faqId=74229d18-e167-c0c1-0434-4d9fa0f74636"}, {"id": "t22", "l1": "商户端使用问题", "l2": "提现问题", "l3": "提现失败", "q": "为什么提现失败了？", "a": "您好，请先确认下您的提现账户是否存在异常，提供您的商户号转人工处理。"}, {"id": "t23", "l1": "商户端使用问题", "l2": "提现问题", "l3": "提现失败", "q": "为什么我的商户号收款没到账？", "a": "您好，请先确认下您的提现账户是否存在异常，提供您的商户号转人工处理。"}, {"id": "t24", "l1": "商户端使用问题", "l2": "发票问题", "l3": "发票问题", "q": "微企付服务费发票在哪开？", "a": "您好，微企付服务费开票请转人工客服处理。"}, {"id": "t25", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "支持渠道", "q": "支持哪些支付方式？", "a": "我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的个人储蓄卡付款；建行、中行、招行、交行、兴业、浦发6家信用卡付款。对公付款支持所有银行的对公转账支付。"}, {"id": "t26", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "支持渠道", "q": "你们都支持哪些银行付款？", "a": "我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的个人储蓄卡付款；建行、中行、招行、交行、兴业、浦发6家信用卡付款。对公付款支持所有银行的对公转账支付。"}, {"id": "t27", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "支持渠道", "q": "微企付可以用什么卡付款？", "a": "我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的个人储蓄卡付款；建行、中行、招行、交行、兴业、浦发6家信用卡付款。对公付款支持所有银行的对公转账支付。"}, {"id": "t28", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "微信支付", "q": "支持微信支付吗？", "a": "您好，目前仅部分平台支持微信支付，我们更推荐您使用银行卡付款。具体银行卡付款的步骤为：在收银台中选择【个人银行卡】-【银行名称】。点击银行后会自动跳转到银行的APP内，输入转账密码即可支付成功。若您在银行列表中找不到目前在用的银行，可以选择【其他银行】根据页面提示完成转账。"}, {"id": "t29", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "微信支付", "q": "可以使用微信余额吗？", "a": "您好，目前仅部分平台支持微信支付，我们更推荐您使用银行卡付款。具体银行卡付款的步骤为：在收银台中选择【个人银行卡】-【银行名称】。点击银行后会自动跳转到银行的APP内，输入转账密码即可支付成功。若您在银行列表中找不到目前在用的银行，可以选择【其他银行】根据页面提示完成转账。"}, {"id": "t30", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "支付宝支付", "q": "支持支付宝付款吗？", "a": "您好，目前暂未支持支付宝支付。\n腾讯微企付是腾讯旗下专为企业经营采购付款设计的大额转账产品，目前支持个人银行卡、企业对公账户等方式完成线上支付，限額最高达100万。"}, {"id": "t31", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "支付宝支付", "q": "可以使用花呗吗？", "a": "您好，目前暂未支持支付宝支付。\n腾讯微企付是腾讯旗下专为企业经营采购付款设计的大额转账产品，目前支持个人银行卡、企业对公账户等方式完成线上支付，限額最高达100万。"}, {"id": "t32", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "支付宝支付", "q": "不能使用支付宝了吗？", "a": "您好，目前暂未支持支付宝支付。\n腾讯微企付是腾讯旗下专为企业经营采购付款设计的大额转账产品，目前支持个人银行卡、企业对公账户等方式完成线上支付，限額最高达100万。"}, {"id": "t33", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "信用卡", "q": "支持信用卡付款吗？", "a": "我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的储蓄卡付款；建行、中行、招行、交行、浦发、兴业的信用卡付款，信用卡目前只支持6家，其余暂不支持。"}, {"id": "t34", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "信用卡", "q": "支持哪些信用卡付款？", "a": "我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的储蓄卡付款；建行、中行、招行、交行、浦发、兴业的信用卡付款，信用卡目前只支持6家，其余暂不支持。"}, {"id": "t35", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "信用卡", "q": "我想用信用卡来付款", "a": "我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的储蓄卡付款；建行、中行、招行、交行、浦发、兴业的信用卡付款，信用卡目前只支持6家，其余暂不支持。"}, {"id": "t36", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "分享付", "q": "微企付可以分享给其他人付款吗？", "a": "可以的，您点击收银台中的“分享给好友付款”即可。"}, {"id": "t37", "l1": "用户端使用问题", "l2": "支付方式与渠道", "l3": "分享付", "q": "我想别人帮我付怎么操作", "a": "可以的，您点击收银台中的“分享给好友付款”即可。"}, {"id": "t38", "l1": "用户端使用问题", "l2": "支付问题", "l3": "如何支付", "q": "怎么付款？", "a": "您好，腾讯微企付主要是使用银行账户来进行支付。\n首先，您先确认下是想要用个人银行卡付款还是企业网银付款。\n1、如果您用个人银行卡：在收银台中选择【个人银行卡】-银行名称。点击银行后会自动跳转到银行的APP内完成输入转账密码后，即可支付成功。若您在银行列表中找不到目前在用的银行，可以选择【其他银行】根据页面提示完成转账。\n2、如果您用对公户付款：在收银台点击【付款户名】-【添加付款户名】，新增企业户名后根据页面中提示向指定账户打款即可。"}, {"id": "t39", "l1": "用户端使用问题", "l2": "支付问题", "l3": "如何支付", "q": "使用微企付怎么支付？", "a": "您好，腾讯微企付主要是使用银行账户来进行支付。\n首先，您先确认下是想要用个人银行卡付款还是企业网银付款。\n1、如果您用个人银行卡：在收银台中选择【个人银行卡】-银行名称。点击银行后会自动跳转到银行的APP内完成输入转账密码后，即可支付成功。若您在银行列表中找不到目前在用的银行，可以选择【其他银行】根据页面提示完成转账。\n2、如果您用对公户付款：在收银台点击【付款户名】-【添加付款户名】，新增企业户名后根据页面中提示向指定账户打款即可。"}, {"id": "t40", "l1": "用户端使用问题", "l2": "支付问题", "l3": "如何支付", "q": "我不会支付怎么办？", "a": "您好，腾讯微企付主要是使用银行账户来进行支付。\n首先，您先确认下是想要用个人银行卡付款还是企业网银付款。\n1、如果您用个人银行卡：在收银台中选择【个人银行卡】-银行名称。点击银行后会自动跳转到银行的APP内完成输入转账密码后，即可支付成功。若您在银行列表中找不到目前在用的银行，可以选择【其他银行】根据页面提示完成转账。\n2、如果您用对公户付款：在收银台点击【付款户名】-【添加付款户名】，新增企业户名后根据页面中提示向指定账户打款即可。"}, {"id": "t41", "l1": "用户端使用问题", "l2": "支付问题", "l3": "不想使用微企付", "q": "我不想使用微企付", "a": "您好，微企付是专业的采购平台付款工具，只要您有银行卡，就可以完成付款的哈。老板您看下您平时一般使用什么银行卡付款？可以在银行列表里选择此银行名称，如果列表中找不到，选择【其他银行】即可。然后跟着界面上步骤完成转账就好啦～您可以尝试一下，第一次使用熟悉了后面付款是很方便的。"}, {"id": "t42", "l1": "用户端使用问题", "l2": "支付问题", "l3": "不想使用微企付", "q": "为什么微企付转账这么麻烦？", "a": "您好，微企付是专业的采购平台付款工具，只要您有银行卡，就可以完成付款的哈。老板您看下您平时一般使用什么银行卡付款？可以在银行列表里选择此银行名称，如果列表中找不到，选择【其他银行】即可。然后跟着界面上步骤完成转账就好啦～您可以尝试一下，第一次使用熟悉了后面付款是很方便的。"}, {"id": "t43", "l1": "用户端使用问题", "l2": "支付问题", "l3": "不想使用微企付", "q": "微企付太难用了，我要用回原来的", "a": "您好，微企付是专业的采购平台付款工具，只要您有银行卡，就可以完成付款的哈。老板您看下您平时一般使用什么银行卡付款？可以在银行列表里选择此银行名称，如果列表中找不到，选择【其他银行】即可。然后跟着界面上步骤完成转账就好啦～您可以尝试一下，第一次使用熟悉了后面付款是很方便的。"}, {"id": "t44", "l1": "用户端使用问题", "l2": "支付问题", "l3": "使用个人卡付款", "q": "怎么使用个人银行卡付款？", "a": "您好，如果您使用个人卡付款的话，可以在收银台中选【个人银行卡】-【显示更多银行】，找到自己银行的名称并选中，然后点击【确定】-【确认付款】，接下来会跳转到银行APP中，您输入银行的转账密码/人脸识别，即可完成付款。"}, {"id": "t45", "l1": "用户端使用问题", "l2": "支付问题", "l3": "使用个人卡付款", "q": "用个人银行卡怎么操作？", "a": "您好，如果您使用个人卡付款的话，可以在收银台中选【个人银行卡】-【显示更多银行】，找到自己银行的名称并选中，然后点击【确定】-【确认付款】，接下来会跳转到银行APP中，您输入银行的转账密码/人脸识别，即可完成付款。"}, {"id": "t46", "l1": "用户端使用问题", "l2": "支付问题", "l3": "使用对公户付款", "q": "用公户要怎么付款？", "a": "您好，对公付款您可以在收银台中选【企业网银】后点击付款，页面中会出现平台收款账号，您在企业网银中向页面中账号转账即可完成付款。使用微企付，采购平台中的下单可以和付款自动关联，转账完成 , "l3": "建设银行", "q": "微企付里怎么使用建行卡进行支付？", "a": "个人付款情况下，您可以在银行列表中仔细查看下是否有【建设银行(储蓄卡)】这个选项，注意要付款户名要选择个人，不要选成企业名称。若在个人银行卡中仍未找到“建行”，您可以点击列表最下方的【显示更多银行】-【其他银行】，页面会显示收款银行信息，通过转账的方式完成付款。\n对公付款付款户名要先选企业名称，再进行转账。"}, {"id": "t96", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "建行支付时提示：微企付暂不支持此证件类型，请使用本人居民身份证登录手机银行。", "a": "您好，请先登录建行手机银行，然后再重新发起支付哈。"}, {"id": "t97", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "建行App显示不支持证件类型", "a": "您好，请先登录建行手机银行，然后再重新发起支付哈。"}, {"id": "t98", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "建行App显示身份信息不一致，订单失效", "a": "请您升级一下建行app，升级完之后再进行支付即可成功。"}, {"id": "t99", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "建行App提示：您的身份信息认证失败，请核对微企付与手机银行身份信息一致。", "a": "请您升级一下建行app，升级完之后再进行支付即可成功。"}, {"id": "t100", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "为什么使用建行显示不能跨行转账？", "a": "您好，可以联系银行开通跨行转账权限哈。"}, {"id": "t101", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "建行付款渠道未完成配置，请联系微企付运营协助处理，或更换其他银行继续完成付款", "a": "您好，可以拉到列表最下方，找到【建设银行-网关储蓄卡】入口进行支付，也是可以支付成功的。"}, {"id": "t102", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "为保证账户资金安全，仅支持已签约的储蓄账户进行交易。您尚无签约储蓄账户可通过我行网点办理。", "a": "您好，这是由于您没开通网上银行所致。您可以按如下方法解决：\n带齐银行卡、身份证等有效证件去建行任一网点开通手机银行。"}, {"id": "t103", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "使用建行提示“回访账户支取限额日取值超限”", "a": "您好，为防范电信网络诈骗，保障客户资金安全，建行当地行对账户设置了分级保护措施，您的账户被银行做了转账限制，单笔限额和日累计限额3000元。如需调整，请您携带有效证件、相应的借记卡和本人实名手机等材料，到建行开户网点解除限额。"}, {"id": "t104", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "使用建行提示“为保证账户资金安全，仅支持已签约的储蓄账户进行交易。您尚无签约储蓄账户可通过我行网点办理。”", "a": "您好，这是由于您没开通网上银行所致。您可以按如下方法解决：\n带齐银行卡、身份证等有效证件去建行任一网点开通手机银行。"}, {"id": "t105", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "使用建行提示“您今天的交易总金额超过全渠道日累计限额。如需调整限额，请携带身份证、银行卡/存折前往网点柜台办理”", "a": "您好，由于您的建行卡设置了全渠道限额，因而导致交易受限。请持有效身份证件到网点申请去掉这个全渠道限额，目前没有线上操作方法。"}, {"id": "t106", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "使用建行提示“您的交易金额超过了该账户的单笔交易限额”", "a": "您好，由于建行对您的账户做了限额设置，所以会出现超额的提醒。需要您修改银行限额设置：打开登陆中国建设银行app-点击右下角「我的」，再点击右上角设置图标进入「设置」模块，点击进入「安全中心」，打开信息管理模块下「限额设置」，完成修改。\n详见指引:https://mqq-imgcache.gtimg.cn/ccm/25f38d25e30dcba9617968a7f84c8c72"}, {"id": "t107", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "使用建行提示“没有可用于支付的账号”", "a": "您好，这是由于您没有在建行龙支付中进行绑卡所致，请在建行首页-龙支付-设置-添加银行卡后即可操作成功。\n详见指引：https://mqq-imgcache.gtimg.cn/ccm/3a6a249295b27e036ced7fdfed8b170b"}, {"id": "t108", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "使用建行提示“建行钱包 (余额￥0.00) 余额不足”", "a": "您好，这是由于您没有在建行龙支付中进行绑卡所致，请在建行首页-龙支付-设置-添加银行卡后即可操作成功。\n详见指引：https://mqq-imgcache.gtimg.cn/ccm/5bfeb8da218834796bc301aad12a5d91"}, {"id": "t109", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "使用建行提示“收付控制状态为封存，不允许交易”", "a": "您好，这是由于您没有在建行龙支付中进行绑卡所致，请在建行首页-龙支付-设置-添加银行卡后即可操作成功。\n详见指引：https://mqq-imgcache.gtimg.cn/ccm/ef983100ba14bf37c2a657bf2869e49b"}, {"id": "t110", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "建设银行", "q": "如何在建行APP绑定建行信用卡", "a": "在建行APP搜索【龙支付】，点击【设置】绑定您的信用卡，重新发起支付选择【建设银行（信用卡】，并在建行APP页面选择信用卡进行支付"}, {"id": "t111", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "怎么找不到农行的入口？", "a": "您在银行列表中仔细查看下是否有【农业银行(储蓄卡)】这个选项，注意要先选【个人银行卡】付款，不要选成“企业网银”。\n若在个人银行卡中仍未找到“农行”，您可以点击列表最下方的【其他银行】，按照页面提示使用转账的方式完成付款。"}, {"id": "t112", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "使用农业银行提示“您未绑定安全工具，请去网点办理”", "a": "您好，这里需要您去农行柜台处理。"}, {"id": "t113", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "使用农业银行提示“登录超时，错误代码”", "a": "您好，可以在农行APP-我的-设置中，把版本设置为标准版，设置完即可支付成功。"}, {"id": "t114", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "使用农业银行提示“金额超过日累计限额，请通过交易安全锁设置”", "a": "您好，可以在农行app里面 搜索“安全中心” 进行修改。"}, {"id": "t115", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "微企付使用农行时提示登录超时", "a": "您好，可以在农行APP-我的-设置中，把版本设置为标准版，设置完即可支付成功。"}, {"id": "t116", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "使用农行时提示卡状态异常", "a": "您好，预计是银行卡被银行冻结了，带上身份证与银行卡去附近银行网点，请银行工作人员将银行卡恢复正常状态"}, {"id": "t117", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "使用农行提示“金额超过日累计限额，请通过交易安全锁设置\"", "a": "您好，这个是由于超过农行设置的日限额了，您可以在农行app里面 搜索“安全中心” 进行修改。"}, {"id": "t118", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "农业银行", "q": "农行提示您未绑定我行K宝/K令等安全认证工具。如需进行转账支付操作， 请通过“转账设置/支付设置-密码支付”开启密码支付，如仍无法满足您的需求，请前往附近网点绑定安全认证工具。", "a": "您好，您可以1、打开农业银行app-搜索「安全中心」，打开「转账设置-支付设置」的密码支付，开启密码支付\n2、或者前往银行柜台，请银行工作人员更新银行卡的支付认证方式，设置为密码认证/短信验证码认证"}, {"id": "t119", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "城/农商行", "q": "农村信用社怎么付款？", "a": "您好，您在付款的时候选择【个人银行卡】-【显示更多银行】-【其他银行】，然后按照页面提示进行转账，转账后咱们的订单就成功付款了。注意，转账时要向咱们页面中提示的收款账户打钱，在农村信用社app中粘贴正确的户名、卡号、金额，然后转账完成后订单就付成功了。"}, {"id": "t120", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "城/农商行", "q": "怎么使用农信卡支付", "a": "您好，您在付款的时候选择【个人银行卡】-【显示更多银行】-【其他银行】，然后按照页面提示进行转账，转账后咱们的订单就成功付款了。注意，转账时要向咱们页面中提示的收款账户打钱，在农村信用社app中粘贴正确的户名、卡号、金额，然后转账完成后订单就付成功了。"}, {"id": "t121", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "城/农商行", "q": "怎么使用城市银行卡付款？", "a": "您好，您在付款的时候选择【个人银行卡】-【显示更多银行】-【其他银行】，然后按照页面提示进行转账，转账后咱们的订单就成功付款了。注意，转账时要向咱们页面中提示的收款账户打钱，在农村信用社app中粘贴正确的户名、卡号、金额，然后转账完成后订单就付成功了。"}, {"id": "t122", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "工商银行", "q": "使用工商银行提示“转账失败：该卡受地区渠道控制不允许做此交易”", "a": "您好，您可以登陆工商银行app-账户安全锁-地区锁（或者打开其他已上锁的模块）关闭已上锁的限制。"}, {"id": "t123", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "工商银行", "q": "使用工商银行提示“转账失败：付款金额大于支付单笔限额”？", "a": "您好，工行在微企付的限额为单笔5万，若您的付款金额小于5万，您可以打开工行app，搜索「限额管理」，打开「电子银行限额调整」，调整限额后即可支付；若您的付款额大于5万，您可以选择【其他银行】添加工行卡完成支付。"}, {"id": "t124", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "工商银行", "q": "使用工商银行提示“查询预留手机号异常”", "a": "您好，由于您未开通工商银行手机银行app，尚未完成实名认证，因而您需要\n在工商银行手机银行app中，根据指引完成实名认证后即可正常支付。"}, {"id": "t125", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "工商银行", "q": "使用工行提示“转账失败：业务开关为关，不能做此业务”", "a": "您好，由于选择了非正常支付银行卡，因而出现失败提示。您可以，切换“转出账户”，选择使用正确的转账卡，即可操作成功。"}, {"id": "t126", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "工商银行", "q": "工行请求网络错误，请稍后重试", "a": "您好，请先退出工行APP然后重新登陆，登录成功后返回订货平台重新下单支付即可。"}, {"id": "t127", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "邮储银行", "q": "使用邮储银行提示“暂无可用银行账号”", "a": "您好，您可以打开银行APP，在\"我的“”我的绑卡“里面看看是否有卡，没有卡的话，新增绑卡。"}, {"id": "t128", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "邮储银行", "q": "使用邮储银行提示“您没有支持此业务功能的帐户”", "a": "您好，这是由于银行卡无转账权限且无数字证书导致。您可以：在邮储银行APP内发起一笔转账，下载“数字证书”后，再重新发起支付。"}, {"id": "t129", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "邮储银行", "q": "使用邮储银行提示“客户名称为空”", "a": "您好，您的邮储卡未开通电子银行，需要去柜台开通电子银行服务。"}, {"id": "t130", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "邮储银行", "q": "使用邮储银行提示“该账户非柜面支付月累计笔数上限为[100]笔，当前已超限。如需提额，请您携带有效证件及卡/折凭证前往我行任意网点申请办理。”", "a": "您好，这是由于账户非柜面支付月累计笔数达到上限所致，需要持卡人携带有效证件及卡/折凭证前往银行任意网点申请办理提额。"}, {"id": "t131", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "邮储银行", "q": "使用邮储银行提示“抱歉，您的设备不支持或尚未设置指纹/面容，暂时无法使用此功能”", "a": "您好，这是由于设备不支持或尚未设置指纹/面容所致，请打开设置手机指纹/面容权限，或是更换银行app支付认证方式，更换为手机验证码/密码支付即可完成付款。"}, {"id": "t132", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "邮储银行", "q": "使用邮储银行提示“商户没有开通该产品权限”", "a": "您好，这是由于长时间没有登录邮政储蓄银行app所致，请重新登陆邮政储蓄银行app后再发起支付。"}, {"id": "t133", "l1": "用户端使用问题", "l2": "银行跳转问题", "l3": "网商银行", "q": "使用网商银行卡打款为什么没成功？", "a": "您好，您使用的二类卡在银行侧身份校验未通过，因此系统无法正常确认您的入账，为保障资金安全，需要您补充转账银行卡号信息，用于验证打款人身份；\n您可以通过短信/公众号推送的补充资料入口填写，或者可以联系客服获取补充资料二维码，补充信息后这张卡可用于正常支付。"}, {"id": "t134", "l1": "用户端使用问题", "l2": "误打款", "l3": "转错", "q": "转错账户了怎么办？", "a": "您好，若您将收款的银行账号输入错误，则打款会原路退回，预计退款次日到账。若次日仍未收到退款，可将您的订单金额、下单平台发给我们来定位。"}, {"id": "t135", "l1": "用户端使用问题", "l2": "误打款", "l3": "转错", "q": "打款的时候输错账号了怎么办？", "a": "您好，若您将收款的银行账号输入错误，则打款会原路退回，预计退款次日到账。若次日仍未收到退款，可将您的订单金额、下单平台发给我们来定位。"}, {"id": "t136", "l1": "用户端使用问题", "l2": "误打款", "l3": "退回", "q": "为什么我的转账被退回了？", "a": "您好，详见转账退款原因：https://mp.weixin.qq.com/s/UZYPCO_jTh-eHtB6fEzVXQ"}, {"id": "t137", "l1": "用户端使用问题", "l2": "误打款", "l3": "退回", "q": "为什么我的付款一直被退回？", "a": "您好，详见转账退款原因：https://mp.weixin.qq.com/s/UZYPCO_jTh-eHtB6fEzVXQ"}, {"id": "t138", "l1": "用户端使用问题", "l2": "预存款问题", "l3": "充值", "q": "预存款怎么充值？", "a": "您好，您可以在微信搜索【腾讯微企付】公众号，依次点击我的账单-【我的】-【预存款账户管理】-【充值】进行金额充值。"}, {"id": "t139", "l1": "用户端使用问题", "l2": "预存款问题", "l3": "提现", "q": "预存款怎么提现？", "a": "您好，您可以在微信搜索【腾讯微企付】公众号，依次点击我的账单-【我的】-【预存款账户管理】-【提现】进行金额提现。"}, {"id": "t140", "l1": "用户端使用问题", "l2": "预存款问题", "l3": "支付", "q": "预存款怎么支付？", "a": "您好，您下单以后在收银台页面点击【预存款账户】，输入密码，完成支付。"}, {"id": "t141", "l1": "用户端使用问题", "l2": "预存款问题", "l3": "授权", "q": "企业预存款账户怎么授权？", "a": "您好，企业预存款有2种授权方式可以选择：\n方式一：会由财付通备付金账户给您的企业账户中打款一笔随机金额，请您在页面填写收到的金额，即可完成验证；\n方式二：由法人进行扫码授权，完成验证。"}, {"id": "t142", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "微信支付失败", "q": "点微信支付报错了怎么办？", "a": "您好，请问是在微企付中点击微信支付后页面无刷新是吗？您尝试退出登陆，然后再重新发起下单支付试一试。"}, {"id": "t143", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "微信支付失败", "q": "点微信支付没反应？", "a": "您好，请问是在微企付中点击微信支付后页面无刷新是吗？您尝试退出登陆，然后再重新发起下单支付试一试。"}, {"id": "t144", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "微信零钱冻结", "q": "提示微信零钱被法院冻结/划扣怎么办？", "a": "您好，您可以微信搜索“腾讯客服”，输入“法院冻结/划扣“，会自动推送解除入口"}, {"id": "t145", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "微信零钱冻结", "q": "依据法律规定及有权机关的要求，当前账户零钱已被限制使用，如有疑问请联系执法机关咨询。执法机关单位可请通过【微信支付】公众号或零钱明细查看详情。", "a": "您好，您可以微信搜索“腾讯客服”，输入“法院冻结/划扣“，会自动推送解除入口"}, {"id": "t146", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "支付失败", "q": "为什么付款不成功？", "a": "您好，请问您当前的页面提示是什么呢？是否方便截个图来看一下？\n目前我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的储蓄卡付款；建行、中行、招行、交行、浦发、兴业6家信用卡付款。"}, {"id": "t147", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "支付失败", "q": "我用微企付无法支付，页面提示错误", "a": "您好，请问您当前的页面提示是什么呢？是否方便截个图来看一下？\n目前我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的储蓄卡付款；建行、中行、招行、交行、浦发、兴业6家信用卡付款。"}, {"id": "t148", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "支付失败", "q": "付款中遇到问题", "a": "您好，请问您当前的页面提示是什么呢？是否方便截个图来看一下？\n目前我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的储蓄卡付款；建行、中行、招行、交行、浦发、兴业6家信用卡付款。"}, {"id": "t149", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "支付失败", "q": "遇到问题导致未成功支付", "a": "您好，请问您当前的页面提示是什么呢？是否方便截个图来看一下？\n目前我们支持交行、建行、农行、平安、浦发、邮储、渤海、中行、工商、招行等所有银行的储蓄卡付款；建行、中行、招行、交行、浦发、兴业6家信用卡付款。"}, {"id": "t150", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "链接失效", "q": "提示链接已失效，请重新下单", "a": "老板您好，该付款链接超时失效了，请重新发起支付，或者重新下单再发起支付哈。"}, {"id": "t151", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "微信账号不一致", "q": "使用微企付提示“授权运行小程序的微信帐号与当前微信帐号不一致，请重新授权”", "a": "您好，这是由于您同时登陆了2个微信所致，您可以：非付款微信退出登陆，剩余的一个付款微信清除app进程，再重新打开进入订货软件下单支付。"}, {"id": "t152", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "无卡无权限", "q": "使用微企付时出现：当前账号实名信息名下无银行卡或无手机银行动账权限", "a": "您好，目前查到您名下没有银行卡信息登记，，可点击【个人银行卡】-【显示更多银行】-【其他银行】，然后按照页面提示在银行APP进行转账，转账后咱们的订单就成功付款了。"}, {"id": "t153", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "付款关闭", "q": "为什么提示付款关闭？", "a": "您好，这是订单超时所致，请重新下单支付。"}, {"id": "t154", "l1": "用户端使用问题", "l2": "支付异常问题", "l3": "付款中断", "q": "为什么显示付款中断？", "a": "您是否已经完成支付了呢，如果已完成可以点“已完成付款”，页面会刷新并给出付款结果；如果未完成支付，请点击“继续付款”，您再进行支付操作即可。"}, {"id": "t155", "l1": "用户端使用问题", "l2": "营销活动", "l3": "红包领取地址", "q": "活动的红包怎么领取？", "a": "您好，红包在微信的“服务通知”里领取，是发放到用微企付下单人员微信上的，详见图片指引：https://mqq-imgcache.gtimg.cn/ccm/655a4a713b0b0042c4c98be69dc1b429"}, {"id": "t156", "l1": "用户端使用问题", "l2": "营销活动", "l3": "红包领取地址", "q": "红包在哪领？", "a": "您好，红包在微信的“服务通知”里领取，是发放到用微企付下单人员微信上的，详见图片指引：https://mqq-imgcache.gtimg.cn/ccm/655a4a713b0b0042c4c98be69dc1b429"}, {"id": "t157", "l1": "用户端使用问题", "l2": "营销活动", "l3": "红包过期", "q": "我的红包过期了怎么办？", "a": "您好，红包发放后需在24小时内领取，超时过期无法领取，请后续注意领取时效。"}, {"id": "t158", "l1": "用户端使用问题", "l2": "营销活动", "l3": "红包未发放", "q": "为什么我付完款没领到红包？", "a": "您好，红包活动规则具体可参考您所在订货平台在收银台中的公示，注意红包活动的时间、数量、参与金额门槛等信息。红包领取地址在：微信-服务通知中。若您没领到红包，是否因为不满足活动参与条件呢？\n红包领取图片指引：https://mqq-imgcache.gtimg.cn/ccm/655a4a713b0b0042c4c98be69dc1b429"}, {"id": "t159", "l1": "用户端使用问题", "l2": "营销活动", "l3": "红包未发放", "q": "我用微企付付钱之后没有收到红包", "a": "您好，红包活动规则具体可参考您所在订货平台在收银台中的公示，注意红包活动的时间、数量、参与金额门槛等信息。红包领取地址在：微信-服务通知中。若您没领到红包，是否因为不满足活动参与条件呢？\n红包领取图片指引：https://mqq-imgcache.gtimg.cn/ccm/655a4a713b0b0042c4c98be69dc1b429"}, {"id": "t160", "l1": "用户端使用问题", "l2": "其他", "l3": "发货物流", "q": "付完钱什么时候发货？", "a": "您好，发货物流问题请咨询您下单平台的客服或客户经理，微企付侧主要解答您的支付问题哈。"}, {"id": "t161", "l1": "用户端使用问题", "l2": "其他", "l3": "平台补贴", "q": "我的平台激励券为什么不能用？", "a": "您好，优惠满减活动问题请咨询您下单平台的客服或客户经理，微企付侧主要解答您的支付问题哈。"}, {"id": "t162", "l1": "用户端使用问题", "l2": "其他", "l3": "平台补贴", "q": "我的返利可以在订货时使用吗？", "a": "您好，优惠满减活动问题请咨询您下单平台的客服或客户经理，微企付侧主要解答您的支付问题哈。"}, {"id": "t163", "l1": "用户端使用问题", "l2": "其他", "l3": "查询付款记录", "q": "怎么查我的微企付个人账单", "a": "您好，您可以微信搜索“腾讯支付助手”进入小程序，即可查看您的历史账单数据"}, {"id": "t164", "l1": "用户端使用问题", "l2": "其他", "l3": "查询付款记录", "q": "有地方查我在微企付的付款记录吗？", "a": "您好，您可以微信搜索“腾讯支付助手”进入小程序，即可查看您的历史账单数据"}], "image": [{"id": "i0", "err": "回访账户支取限额日取值超限 如有疑问，请致电95533咨询\n参考码：NWQF03.YBLA0332XX02", "a": "您好，为防范电信网络诈骗，保障客户资金安全，当地行对账户设置了分级保护措施，本账户被银行设置了单笔限额和日累计限额。如需调整，请客户携带有效证件、相应的借记卡和本人实名手机等材料，到建行开户网点解除限额", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_0.jpg"}, {"id": "i1", "err": "为保证账户资金安全，仅支持已签约的储蓄账户进行交易。您尚无签约储蓄账户，可通过我行网点办理。\n参考码：0760T0369001", "a": "您好，这是由于您没开通网上银行所致。您可以按如下方法解决：\n带齐银行卡、身份证等有效证件去建行任一网点开通手机银行。", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_1.jpg"}, {"id": "i2", "err": "您今天的交易总金额超过全渠道日累计限额。如需调整限额，请携带身份证、银行卡/存折前往网点柜台办理，详情请咨询在线客服或95533。\n参考码：YALP1000QLMT", "a": "您好，您可以到网点申请去掉这个全渠道限额，目前没有线上操作方法～", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_2.jpg"}, {"id": "i3", "err": "微企付暂不支持此证件类型，请使用本人居民身份证登录手机银行。", "a": "您好，由于您建行app版本太旧，请去应用市场更新下载建行APP，更新后即可正常使用。", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_3.jpg"}, {"id": "i4", "err": "该订单暂不可支付，请与商户联系确认订单\n状态\n参考码：NWQFO3YCEP1001WQF6", "a": "您好，把银行APP跟小程序全部关掉再重新点击试试", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_4.jpg"}, {"id": "i5", "err": "您的交易金额超过了该账户的单笔交易限额。\n参考码：NWQF03.YALP1000ACSL", "a": "您好，这是由于您的交易金额超过了该账户的单笔交易限额。您可以：打开登陆中国建设银行app-点击右下角「我的」，再点击右上角设置图标进入「设置」模块，点击进入「安全中心」，打开信息管理模块下「限额设置」，完成设置。\n若银行APP上无法修改限额，请前往营业网点线下办理提额。", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_5.jpg"}, {"id": "i6", "err": "您的交易金额超过了该账户的单笔交易限额。\n参考码：NWQF03.YALP1000ACSL", "a": "您好，这是由于您的交易金额超过了该账户的单笔交易限额。您可以：打开登陆中国建设银行app-点击右下角「我的」，再点击右上角设置图标进入「设置」模块，点击进入「安全中心」，打开信息管理模块下「限额设置」，完成设置。\n若银行APP上无法修改限额，请前往营业网点线下办理提额。", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_6.jpg"}, {"id": "i7", "err": "您的身份信息认证失败，请核对微企付与手机银行身份信息一致。", "a": "您好，您的银行APP非最新版本，请更新至最新版APP", "img": "https://raw.githubusercontent.com/weiqifu/callce llcenter-assets/main/images/err_177.jpg"}, {"id": "i178", "err": "交易金额超出商户交易模式维度单笔支付限额，请检查商户交易模式维度单笔支付限额", "a": "您好，这个是您的农业银行网关支付渠道限额了，可以联系银行客服进行额度提升，谢谢。", "img": "https://raw.githubusercontent.com/weiqifu/callcenter-assets/main/images/err_178.jpg"}]};
let MODE = 'text';
let curFilter = null; // {l1,l2} or null
let curQuery = '';

const $ = s=>document.querySelector(s);
const esc = s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---- build text tree ----
function buildTree(){
  const tree = {};
  DATA.text.forEach(it=>{
    const l1=it.l1||'未分类', l2=it.l2||'其他';
    tree[l1]=tree[l1]||{};
    tree[l1][l2]=(tree[l1][l2]||0)+1;
  });
  return tree;
}

function renderSide(){
  const el=$('#tree');
  if(MODE==='image'){
    $('#sideTitle').textContent='报错类型';
    el.innerHTML = `<div class="node ${curFilter===null?'active':''}" onclick="clearFilter()">全部报错样例<span class="cnt">${DATA.image.length}</span></div>
      <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6">上传/复制用户截图里的<b>报错文字</b>或<b>参考码</b>到搜索框，即可匹配对应处理话术。</p>`;
    return;
  }
  $('#sideTitle').textContent='问题目录';
  const tree=buildTree();
  let html=`<div class="node ${curFilter===null?'active':''}" onclick="clearFilter()" style="font-weight:700;margin-bottom:8px">全部问题<span class="cnt">${DATA.text.length}</span></div>`;
  for(const l1 in tree){
    const total=Object.values(tree[l1]).reduce((a,b)=>a+b,0);
    const open = curFilter&&curFilter.l1===l1 ? 'open':'';
    html+=`<div class="l1 ${open}">
      <div class="node" onclick="toggleL1(this,'${l1}')">
        <span><span class="arrow">▶</span> ${l1}</span><span class="cnt">${total}</span>
      </div>
      <div class="l2wrap">`;
    for(const l2 in tree[l1]){
      const act = curFilter&&curFilter.l1===l1&&curFilter.l2===l2?'active':'';
      html+=`<div class="l2"><div class="node ${act}" onclick="pickL2(event,'${l1}','${l2}')">${l2}<span class="cnt">${tree[l1][l2]}</span></div></div>`;
    }
    html+=`</div></div>`;
  }
  el.innerHTML=html;
}

function toggleL1(node,l1){
  const li=node.closest('.l1');
  // filter to whole l1 & toggle
  li.classList.toggle('open');
  curFilter={l1:l1,l2:null}; curQuery=''; $('#q').value='';
  renderSide(); renderList();
}
function pickL2(e,l1,l2){
  e.stopPropagation();
  curFilter={l1,l2}; curQuery=''; $('#q').value='';
  renderSide(); renderList();
}
function clearFilter(){ curFilter=null; curQuery=''; $('#q').value=''; renderSide(); renderList(); }

// ---- search scoring ----
function tokenize(s){ return (s||'').toLowerCase().replace(/[，。？！,.\?!、：:；;\s]+/g,' ').trim(); }
function scoreText(it,qs){
  const hay=(it.q+' '+it.a+' '+it.l1+' '+it.l2+' '+it.l3).toLowerCase();
  let sc=0;
  qs.forEach(t=>{
    if(!t)return;
    if(it.q.toLowerCase().includes(t)) sc+=10;
    if(it.a.toLowerCase().includes(t)) sc+=4;
    if((it.l2+it.l3).toLowerCase().includes(t)) sc+=3;
    if(hay.includes(t)) sc+=1;
  });
  return sc;
}
function scoreImg(it,qs){
  let sc=0;
  qs.forEach(t=>{
    if(!t)return;
    if(it.err.toLowerCase().includes(t)) sc+=10;
    if(it.a.toLowerCase().includes(t)) sc+=3;
  });
  return sc;
}

function highlight(text,qs){
  let out=esc(text);
  qs.filter(Boolean).sort((a,b)=>b.length-a.length).forEach(t=>{
    if(t.length<1)return;
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  });
  return out;
}

function renderList(){
  const list=$('#list'); const qs=curQuery?curQuery.split(' ').filter(Boolean):[];
  let items=[];
  if(MODE==='image'){
    if(curQuery){
      items=DATA.image.map(it=>({it,sc:scoreImg(it,qs)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
    } else {
      items=DATA.image.map(it=>({it,sc:0}));
    }
  } else {
    let pool=DATA.text;
    if(curFilter){ pool=pool.filter(it=>it.l1===curFilter.l1 && (!curFilter.l2||it.l2===curFilter.l2)); }
    if(curQuery){
      items=pool.map(it=>({it,sc:scoreText(it,qs)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
    } else {
      items=pool.map(it=>({it,sc:0}));
    }
  }

  // crumb & stat
  let crumb='';
  if(MODE==='image') crumb='<b>报错识别库</b>';
  else if(curFilter) crumb=`<b>${curFilter.l1}</b>${curFilter.l2?' / <b>'+curFilter.l2+'</b>':''}`;
  else crumb='<b>全部问题</b>';
  if(curQuery) crumb+=` <span style="color:var(--brand)">· 搜索「${esc(curQuery)}」</span>`;
  $('#crumb').innerHTML=crumb;
  $('#stat').innerHTML= curQuery ? `匹配到 <b>${items.length}</b> 条结果` : `共 <b>${items.length}</b> 条`;

  if(items.length===0){
    list.innerHTML=`<div class="empty"><div class="big">🔍</div>没有找到相关内容，换个关键词试试～</div>`;
    return;
  }

  let html='';
  items.forEach(({it},idx)=>{
    const openFirst = (curQuery && idx===0) ? 'open':'';
    if(MODE==='image'){
      html+=`<div class="card ${openFirst}">
        <div class="qhead" onclick="this.parentNode.classList.toggle('open')">
          <span class="qico">报</span>
          <div class="qtext">${highlight(it.err.split('\n')[0],qs)}<div class="tags"><span class="tag err">报错样例 #${it.id.slice(1)}</span></div></div>
          <span class="toggle">▼</span>
        </div>
        <div class="ans"><div class="ans-inner">
          ${it.img?`<div class="shot"><span class="lbl">🖼️ 报错截图</span><br><img src="${it.img}" alt="报错截图" loading="lazy" onclick="zoom(this.src)"><div class="shot-tip">点击图片可放大查看</div></div>`:''}
          <div class="errbox"><span class="lbl">📷 报错识别信息</span><br>${highlight(it.err,qs)}</div>
          <span class="lbl">✅ 建议回复</span><br>${highlight(it.a,qs)}
        </div></div>
      </div>`;
    } else {
      html+=`<div class="card ${openFirst}">
        <div class="qhead" onclick="this.parentNode.classList.toggle('open')">
          <span class="qico">Q</span>
          <div class="qtext">${highlight(it.q,qs)}
            <div class="tags"><span class="tag">${it.l1}</span><span class="tag">${it.l2}</span>${it.l3&&it.l3!==it.l2?'<span class="tag">'+it.l3+'</span>':''}</div>
          </div>
          <span class="toggle">▼</span>
        </div>
        <div class="ans"><div class="ans-inner"><span class="lbl">✅ 标准答案</span><br>${highlight(it.a,qs)}</div></div>
      </div>`;
    }
  });
  list.innerHTML=html;
}

function doSearch(){
  curQuery=tokenize($('#q').value);
  if(curQuery && MODE==='text') curFilter=null; // 搜索时跨全部
  renderSide(); renderList();
}

// hot chips
function renderHint(){
  if(MODE==='image'){
    $('#hint').innerHTML='把用户截图中的<b>报错文字</b>或<b>参考码</b>粘进搜索框即可匹配处理话术。 常见：'+
      ['单笔限额','日累计限额','身份信息认证失败','龙支付 绑卡','账户类型'].map(t=>`<span class="chip" onclick="quick('${t}')">${t}</span>`).join(' ');
  } else {
    $('#hint').innerHTML='热门搜索： '+
      ['微企付是什么','费率','怎么接入','限额调整','怎么退款','实名认证','开发票','提现'].map(t=>`<span class="chip" onclick="quick('${t}')">${t}</span>`).join(' ');
  }
}
function quick(t){ $('#q').value=t; doSearch(); }
function zoom(src){ $('#lightbox-img').src=src; $('#lightbox').classList.add('show'); }

// tab switch
document.querySelectorAll('.tab').forEach(tb=>{
  tb.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    tb.classList.add('active');
    MODE=tb.dataset.mode; curFilter=null; curQuery=''; $('#q').value='';
    $('#q').placeholder = MODE==='image'?'粘贴报错文字或参考码，如：单笔限额 / NWQF03…':'输入问题或关键词，如：费率、限额、怎么退款…';
    renderHint(); renderSide(); renderList();
  };
});
$('#searchBtn').onclick=doSearch;
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter')doSearch(); });
$('#q').addEventListener('input',()=>{ if($('#q').value==='' ){curQuery='';renderList();} });

renderHint(); renderSide(); renderList();
</script>
